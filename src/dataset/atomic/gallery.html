<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>NavCraft 原子空间任务展示集</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;background:#f3f5f8;color:#152137;margin:0}header{padding:24px 5vw;background:#12213b;color:white}main{max-width:1400px;margin:20px auto;padding:0 20px}select{padding:9px;margin:8px}article{background:white;padding:22px;border-radius:12px;margin:20px 0;border:1px solid #ccd6e2}h2{margin:0}small,.muted{color:#63718b}.badges{color:#24528d;margin:8px 0}.images{display:flex;flex-wrap:wrap;gap:12px}.images img{max-width:100%;max-height:460px;object-fit:contain;background:#eee}.images a{max-width:48%}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#edf2f8;font-size:13px}details{margin:12px 0}summary{cursor:pointer;font-weight:600}.turn{border-left:3px solid #9cb3cd;padding:8px 15px;margin:10px 0}.target{border-left-color:#238763;background:#f0faf5}.tool{border-left-color:#d69424}a{color:#1762b3}header a{color:#b7d6ff}label{display:inline-block}button{padding:8px;cursor:pointer}.warning{color:#8c5113}
</style><header><h1>原子空间任务 · 真实数据展示集</h1><p>短程空间能力 × 简单 QA / 查询 QA / 交互 QA / 交互 IA</p><div id="stats"></div><p>这是一份经筛选和修订的数据形态展示，不是模型成功率报告。私有标准答案仅在审阅区显示。</p><a href="conversations.jsonl">完整训练对话</a> · <a href="decisions.jsonl">逐决策训练数据</a> · <a href="manifest.jsonl">清单</a> · <a href="validation.json">验收统计</a></header>
<main><label>任务簇 <select id="cluster"><option value="">全部</option></select></label><label>形式 <select id="form"><option value="">全部</option></select></label><label>观测 <select id="observation"><option value="">全部</option><option value="single">单帧</option><option value="panorama">全景</option></select></label><div id="cards"></div></main>
<script>
const DATA=__PAYLOAD__;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
for(const key of ['cluster','form'])for(const [k,v] of Object.entries(DATA[key==='cluster'?'clusters':'forms']))document.getElementById(key).insertAdjacentHTML('beforeend',`<option value="${k}">${k} · ${esc(v)}</option>`);
document.getElementById('stats').textContent=`${DATA.report.samples} 条合格样例 · ${DATA.report.decisions} 个训练决策 · ${DATA.report.requests} 次实际模型请求 · 来源 ${JSON.stringify(DATA.report.sources)}`;
function message(m,i,excluded=[]){let role=m.role||m.type;let target=(m.role==='assistant'||m.type==='function_call')&&!excluded.includes(m.call_id);let body='';if(Array.isArray(m.content)){for(const p of m.content){if(p.type==='input_image')body+=`<a href="${esc(p.image_path)}" target="_blank"><img loading="lazy" src="${esc(p.image_path)}" title="${esc(p.image_path)}"></a>`;else if(p.text)body+='<pre>'+esc(p.text)+'</pre>';}}else body=pretty(m);return `<div class="turn ${target?'target':m.type==='function_call_output'?'tool':''}"><b>${i} · ${esc(role)} ${target?'— 训练目标':excluded.includes(m.call_id)?'— 原始失败调用，不训练':'— 输入条件'}</b><div class="images">${body}</div></div>`;}
function render(){const filters=['cluster','form','observation'].map(k=>[k,document.getElementById(k).value]);document.getElementById('cards').innerHTML=DATA.cards.filter(c=>filters.every(([k,v])=>!v||c.meta[k]===v)).map(c=>{let m=c.meta;return `<article id="${esc(m.id)}"><h2>${esc(m.id)} · ${esc(DATA.clusters[m.cluster])}</h2><div class="badges">${esc(DATA.forms[m.form])} | ${esc(m.observation)} | ${esc(m.capabilities.join(' + '))} | ${esc(m.source)} ${m.revised?'· 经修订':''}</div><p>${esc(m.question)}</p><p class="muted">定位条件：${esc(m.pose_condition)} · 答案时刻：${esc(m.anchor)}</p><details><summary>可调用工具与固定资源</summary>${pretty(c.tools)}${pretty(m.resources)}</details><details open><summary>真实输入、逐轮交互及训练目标</summary>${c.messages.map((m,i)=>message(m,i,c.excluded_training_call_ids)).join('')}</details><details><summary>私有核验、标准答案与来源（不进入模型输入）</summary>${pretty(m.validation)}${pretty(c.labels)}${pretty(m.selection)}${pretty(m.source_components)}${m.attempts.map(a=>`<p><a href="${esc(a.path)}">${esc(a.source)} · ${a.validation.passed?'通过':'原始失败'}记录</a></p>`).join('')}<a href="${esc(m.sample_directory)}/attempts/${esc(m.selected_attempt)}/record.json">原始交互记录</a></details></article>`}).join('');}
for(const k of ['cluster','form','observation'])document.getElementById(k).addEventListener('change',render);render();
</script></html>
